name: secret-scan

# Confidentiality guard for the public OSS repo: blocks secrets and
# confidential/planning paths from entering history via push or PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  confidential-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on confidential / planning / secret paths
        run: |
          set -euo pipefail
          # Block real env files (.env, .env.local, .env.production) but NOT
          # committed examples (.env.example / .sample / .template).
          # Public-key fixtures (root-public.pem) are allowed.
          block='(^|/)\.planning/|(^|/)private/|^pro/|^_pro_placeholder/|(^|/)\.env$|(^|/)\.env\.(local|production|development)$|(^|/)id_(rsa|ed25519)($|\.)|(^|/)credentials(\.|$)'
          hits="$(git ls-files | grep -E "$block" || true)"
          # .key and .pem: block everything except public-key fixtures.
          keyhits="$(git ls-files '*.key' '*.pem' | grep -Ev 'root[-_]public\.pem$' || true)"
          if [ -n "$hits$keyhits" ]; then
            echo "::error::Confidential/planning/secret paths present in the OSS repo:"
            printf '%s\n' "$hits" "$keyhits" | sed '/^$/d'
            exit 1
          fi
          echo "No confidential/planning/secret paths tracked. OK."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks binary — no org license needed)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-banner --verbose
